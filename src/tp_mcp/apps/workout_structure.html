<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout structure</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1d21; --muted: #6b7280; --grid: #e5e7eb; --tile: #f3f4f6;
    --warm: #93c5fd; --active: #2563eb; --hard: #dc2626; --rest: #d1d5db; --cool: #86efac;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af; --grid: #2a2f36; --tile: #1c2127;
      --warm: #1e3a5f; --active: #60a5fa; --hard: #f87171; --rest: #374151; --cool: #14532d;
    }
  }
  /* Host-driven theme (MCP Apps hostContext) overrides the media query */
  :root[data-theme="dark"] {
      --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af; --grid: #2a2f36; --tile: #1c2127;
      --warm: #1e3a5f; --active: #60a5fa; --hard: #f87171; --rest: #374151; --cool: #14532d;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1d21; --muted: #6b7280; --grid: #e5e7eb; --tile: #f3f4f6;
    --warm: #93c5fd; --active: #2563eb; --hard: #dc2626; --rest: #d1d5db; --cool: #86efac;
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  .wrap { padding: 12px 14px; }
  .head h2 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #chartbox { position: relative; }
  svg { width: 100%; height: 170px; display: block; }
  #tip { position: absolute; pointer-events: none; background: var(--tile); color: var(--fg);
         border: 1px solid var(--grid); border-radius: 6px; padding: 5px 8px; font-size: 11px;
         display: none; white-space: pre; z-index: 2; }
  .tiles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tile { background: var(--tile); border-radius: 8px; padding: 6px 12px; }
  .tile .v { font-size: 16px; font-weight: 650; }
  .tile .l { color: var(--muted); font-size: 11px; }
  #desc { color: var(--muted); font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  #empty { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h2 id="title">Workout</h2><div class="sub" id="sub"></div></div>
  <div id="chartbox" hidden>
    <svg id="chart" viewBox="0 0 720 170" preserveAspectRatio="none"></svg>
    <div id="tip"></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="desc"></div>
  <div id="empty">Waiting for workout data&#8230;</div>
</div>
<script>
"use strict";
// Workout titles, descriptions and STEP NAMES are user-authored: textContent only.
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function fmt(x, dp) { return (x == null || isNaN(x)) ? "-" : Number(x).toFixed(dp == null ? 0 : dp); }
const SUPPORTED_LENGTH_UNITS = new Set(["second", "meter", "mile"]);
const METERS_PER_MILE = 1609.344;

function formatDuration(sec) {
  const rounded = Math.round(sec);
  if (rounded < 60) return rounded + "s";
  if (rounded % 60 === 0) return (rounded / 60) + "min";
  return Math.floor(rounded / 60) + "m " + (rounded % 60) + "s";
}

function formatDistance(value, unit) {
  if (unit === "mile") {
    const dp = value < 10 ? 2 : 1;
    return fmt(value, dp).replace(/\.0+$/, "") + " mi";
  }
  if (value >= 1000) {
    const km = value / 1000;
    return fmt(km, km < 10 ? 2 : 1).replace(/\.0+$/, "") + " km";
  }
  return fmt(value) + " m";
}

function formatStepLength(step) {
  return step.lengthUnit === "second"
    ? formatDuration(step.lengthValue)
    : formatDistance(step.lengthValue, step.lengthUnit);
}

function extractPayload(data) {
  try {
    const text = data && data.result && data.result.content && data.result.content[0]
      && data.result.content[0].text;
    if (typeof text === "string") return JSON.parse(text);
  } catch (e) { /* fall through */ }
  if (data && data.result && data.result.structuredContent) return data.result.structuredContent;
  if (data && (data.structured_workout !== undefined || data.title)) return data;
  return null;
}

function flattenSteps(sw) {
  // Native TP: structure = [{type: "step"|"repetition", length: {...}, steps: [...]}]
  const out = [];
  const blocks = (sw && Array.isArray(sw.structure)) ? sw.structure : [];
  for (const b of blocks) {
    const inner = Array.isArray(b.steps) ? b.steps : (b.type === "step" ? [b] : []);
    const reps = (b.type === "repetition" && b.length && b.length.unit === "repetition")
      ? Math.max(1, Number(b.length.value) || 1) : 1;
    for (let r = 0; r < reps; r++) {
      for (const s of inner) {
        const unit = s.length && s.length.unit;
        const value = Number(s.length && s.length.value);
        if (!SUPPORTED_LENGTH_UNITS.has(unit) || !Number.isFinite(value) || value <= 0) continue;
        const t = (Array.isArray(s.targets) && s.targets[0]) ? s.targets[0] : {};
        const rawLo = Number(t.minValue), rawHi = Number(t.maxValue);
        const lo = Number.isFinite(rawLo) ? rawLo : (Number.isFinite(rawHi) ? rawHi : 0);
        const hi = Number.isFinite(rawHi) ? rawHi : lo;
        out.push({
          name: typeof s.name === "string" ? s.name : "",
          lengthValue: value,
          lengthUnit: unit,
          lo: lo,
          hi: hi,
          cls: typeof s.intensityClass === "string" ? s.intensityClass : "active",
        });
      }
    }
  }
  return out;
}

function lengthKind(unit) { return unit === "second" ? "duration" : "distance"; }

function distanceIn(value, fromUnit, toUnit) {
  if (fromUnit === toUnit) return value;
  return toUnit === "mile" ? value / METERS_PER_MILE : value * METERS_PER_MILE;
}

function primaryLengthKind(sw, steps) {
  const declared = sw && typeof sw.primaryLengthMetric === "string"
    ? sw.primaryLengthMetric.toLowerCase() : "";
  if ((declared === "duration" || declared === "distance")
      && steps.some(s => lengthKind(s.lengthUnit) === declared)) return declared;
  return lengthKind(steps[0].lengthUnit);
}

function chartScale(sw, steps) {
  const kinds = new Set(steps.map(s => lengthKind(s.lengthUnit)));
  const primaryKind = primaryLengthKind(sw, steps);
  if (kinds.size > 1) {
    // Seconds and distance cannot be converted without knowing pace. Equal-width
    // slots keep every step visible without implying a false conversion.
    return {
      label: "Mixed distance / duration · " + primaryKind + " primary",
      weight: () => 1,
    };
  }
  if (primaryKind === "duration") {
    const total = steps.reduce((sum, s) => sum + s.lengthValue, 0);
    return {
      label: "Duration · " + formatDuration(total),
      weight: s => s.lengthValue,
    };
  }
  const unit = steps.every(s => s.lengthUnit === "mile") ? "mile" : "meter";
  const total = steps.reduce((sum, s) => sum + distanceIn(s.lengthValue, s.lengthUnit, unit), 0);
  return {
    label: "Distance · " + formatDistance(total, unit),
    weight: s => distanceIn(s.lengthValue, s.lengthUnit, unit),
  };
}

function intensityLabels(sw) {
  const metric = sw && sw.primaryIntensityMetric;
  if (metric === "percentOfFtp") return { reference: "FTP", suffix: "% FTP" };
  if (metric === "percentOfThresholdHr") return { reference: "Threshold HR", suffix: "% threshold HR" };
  if (metric === "percentOfThresholdPace") return { reference: "Threshold pace", suffix: "% threshold pace" };
  return { reference: "100%", suffix: "%" };
}

function tooltipText(step, intensity) {
  const target = step.lo === step.hi ? fmt(step.lo) : fmt(step.lo) + "-" + fmt(step.hi);
  return (step.name || step.cls) + "\n" + formatStepLength(step) + " @ " + target + intensity.suffix;
}

function colourFor(step) {
  const c = step.cls.toLowerCase();
  if (c.indexOf("warm") === 0) return "var(--warm)";
  if (c.indexOf("cool") === 0) return "var(--cool)";
  if (c === "rest") return "var(--rest)";
  return step.hi >= 100 ? "var(--hard)" : "var(--active)";
}

function renderProfile(steps, sw) {
  $("chartbox").hidden = false;
  const svg = $("chart");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const W = 720, H = 170, padB = 18, padT = 6;
  const scale = chartScale(sw, steps);
  const weights = steps.map(scale.weight);
  const total = weights.reduce((a, value) => a + value, 0) || 1;
  const maxI = Math.max(110, ...steps.map(s => s.hi)) * 1.05;
  const intensity = intensityLabels(sw);
  // Threshold reference line at 100% of the workout's primary intensity metric.
  const yFtp = padT + (1 - 100 / maxI) * (H - padT - padB);
  svg.appendChild(el("line", { x1: 0, x2: W, y1: yFtp, y2: yFtp,
    stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "4,3" }));
  const ftpLabel = el("text", { x: W - 4, y: yFtp - 3, fill: "var(--muted)",
    "font-size": 9, "text-anchor": "end" });
  ftpLabel.textContent = intensity.reference;
  svg.appendChild(ftpLabel);

  const scaleLabel = el("text", { x: 4, y: H - 3, fill: "var(--muted)", "font-size": 9 });
  scaleLabel.textContent = scale.label;
  svg.appendChild(scaleLabel);

  let t = 0;
  const rects = [];
  for (let index = 0; index < steps.length; index++) {
    const s = steps[index], stepWeight = weights[index];
    const x = (t / total) * W, w = Math.max(1.5, (stepWeight / total) * W - 1);
    const mid = (s.lo + s.hi) / 2 || 1;
    const h = Math.max(3, (mid / maxI) * (H - padT - padB));
    const rect = el("rect", { x: x, y: H - padB - h, width: w, height: h,
      fill: colourFor(s), rx: 1.5, "aria-label": tooltipText(s, intensity) });
    const title = el("title", {});
    title.textContent = tooltipText(s, intensity);
    rect.appendChild(title);
    svg.appendChild(rect);
    rects.push([x, x + w, s]);
    t += stepWeight;
  }
  const tip = $("tip"), box = $("chartbox");
  svg.onmousemove = (ev) => {
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    const hit = rects.find(([a, b2]) => fx >= a && fx <= b2);
    if (!hit) { tip.style.display = "none"; return; }
    const s = hit[2];
    tip.textContent = tooltipText(s, intensity);
    tip.style.display = "block";
    const bx = box.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - bx.left + 12, bx.width - 120) + "px";
    tip.style.top = (ev.clientY - bx.top + 10) + "px";
  };
  svg.onmouseleave = () => { tip.style.display = "none"; };
}

function addTile(v, l) {
  const tile = document.createElement("div"); tile.className = "tile";
  const vd = document.createElement("div"); vd.className = "v"; vd.textContent = v;
  const ld = document.createElement("div"); ld.className = "l"; ld.textContent = l;
  tile.appendChild(vd); tile.appendChild(ld); $("tiles").appendChild(tile);
}

function render(p) {
  $("empty").hidden = true;
  $("title").textContent = p.title || "Workout";
  $("sub").textContent = [p.sport, p.date].filter(Boolean).join(" - ");
  while ($("tiles").firstChild) $("tiles").removeChild($("tiles").firstChild);
  const m = p.metrics || {};
  const dur = m.duration_actual != null ? m.duration_actual : m.duration_planned;
  if (dur != null) addTile(fmt(dur, 1) + "h", m.duration_actual != null ? "duration" : "planned duration");
  const tss = m.tss_actual != null ? m.tss_actual : m.tss_planned;
  if (tss != null) addTile(fmt(tss), m.tss_actual != null ? "TSS" : "planned TSS");
  const dist = m.distance_actual_km != null ? m.distance_actual_km : m.distance_planned_km;
  if (dist != null) addTile(fmt(dist, 1) + "km", "distance");
  if (m.avg_power != null) addTile(fmt(m.avg_power) + "W", "avg power");
  if (m.avg_hr != null) addTile(fmt(m.avg_hr), "avg HR");

  const steps = flattenSteps(p.structured_workout);
  if (steps.length > 0) {
    renderProfile(steps, p.structured_workout);
  } else {
    $("chartbox").hidden = true;  // unstructured: summary fields only
  }
  $("desc").textContent = typeof p.description === "string" ? p.description : "";
}

const APP_NAME = "Workout structure viewer";
// ---- MCP Apps view protocol (inline implementation of the ext-apps wire
// protocol - JSON-RPC 2.0 over postMessage; CSP forbids loading the SDK) ----
let _rpcId = 0;
const _pending = {};
function _request(method, params) {
  return new Promise((resolve) => {
    const id = ++_rpcId;
    _pending[id] = resolve;
    window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
  });
}
function _notify(method, params) {
  window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
}
function _applyHostContext(ctx) {
  if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) {
    document.documentElement.setAttribute("data-theme", ctx.theme);
  }
}
function _reportSize() {
  _notify("ui/notifications/size-changed", {
    width: document.documentElement.scrollWidth,
    height: document.documentElement.scrollHeight,
  });
}
function _handleToolResult(result) { // params: standard CallToolResult
  const payload = extractPayload({ result: result });
  if (payload) { render(payload); requestAnimationFrame(_reportSize); }
}
window.addEventListener("message", (event) => {
  const d = event.data;
  if (!d || d.jsonrpc !== "2.0") {
    const payload = extractPayload(d); // legacy raw-postMessage hosts
    if (payload) { render(payload); requestAnimationFrame(_reportSize); }
    return;
  }
  if (d.id != null && d.method == null) { // response to one of our requests
    const resolve = _pending[d.id];
    if (resolve) { delete _pending[d.id]; resolve(d.result); }
    return;
  }
  if (d.method === "ui/notifications/tool-result") { _handleToolResult(d.params || {}); return; }
  if (d.method === "ui/notifications/host-context-changed") { _applyHostContext(d.params || {}); return; }
  if (d.method === "ui/resource-teardown" && d.id != null) {
    window.parent.postMessage({ jsonrpc: "2.0", id: d.id, result: {} }, "*");
  }
});
(async function _connect() {
  const init = await _request("ui/initialize", {
    protocolVersion: "2025-06-18",
    appInfo: { name: APP_NAME, version: "1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  });
  _applyHostContext(init && init.hostContext);
  _notify("ui/notifications/initialized");
})();
if (window.ResizeObserver) {
  new ResizeObserver(function () { _reportSize(); }).observe(document.body);
}
</script>
</body>
</html>
