name: Release executables

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x86_64
            executable: tp-mcp
          - runner: windows-latest
            asset: windows-x86_64
            executable: tp-mcp.exe
          - runner: macos-15
            asset: macos-arm64
            executable: tp-mcp
          - runner: macos-15-intel
            asset: macos-x86_64
            executable: tp-mcp

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[browser,build,dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build executable
        run: python scripts/build_executable.py

      - name: Smoke-test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/tp-mcp.exe help
          else
            ./dist/tp-mcp help
          fi

      - name: Name release asset
        shell: bash
        run: mv "dist/${{ matrix.executable }}" "dist/tp-mcp-${{ matrix.asset }}${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: tp-mcp-${{ matrix.asset }}
          path: dist/tp-mcp-${{ matrix.asset }}${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum tp-mcp-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --generate-notes
          --title "${GITHUB_REF_NAME}"
